<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101116">
<meta name="description" content="Vaelis — a focused AI chat experience.">
<title>Vaelis — AI Chat</title>
<link rel="preconnect" href="https://vaelis-backend.prathameshsinghsingh5.workers.dev" crossorigin>
<link rel="icon" href="https://res.cloudinary.com/dufbzl68g/image/upload/c_limit,w_160,q_auto,f_auto/v1792908468/file_0000000044508208ac7a581e5d5df8b3_hqevpe.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script>
// Logo fallback: if the optimized logo fails, try the original URL, then a plain "V".
window.__logoErr=function(img){
  if(!img.dataset.t){img.dataset.t='1';img.src='https://res.cloudinary.com/dufbzl68g/image/upload/v1792908468/file_0000000044508208ac7a581e5d5df8b3_hqevpe.png';return;}
  var s=document.createElement('span');s.className='logo-fallback';s.textContent='V';img.replaceWith(s);
};
</script>
<style>
:root{color-scheme:dark;--bg:#101116;--panel:#171920;--panel2:#1e212a;--panel3:#252935;--text:#f3f4f8;--muted:#9da3b2;--line:#2b2e39;--accent:#a9a5ff;--accent2:#7771ed;--danger:#ff777f;--good:#70d6b1;--radius:18px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);height:100dvh;overflow:hidden}
button,input,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,.chat-item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100dvh;display:flex;background:var(--bg)}

/* ---------- logo ---------- */
.logo{display:block;width:32px;height:32px;object-fit:contain;border-radius:9px;flex:none}
.logo-fallback{display:grid;place-items:center;width:100%;height:100%;min-width:28px;min-height:28px;border-radius:10px;background:linear-gradient(145deg,#b6b0ff,#7169e8);color:#17152b;font-weight:900}

/* ---------- sidebar ---------- */
.sidebar{width:276px;flex:0 0 276px;background:#14151b;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px 10px;gap:10px;z-index:20;transition:transform .22s ease;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px}
.brand-name{font-size:17px;font-weight:750;letter-spacing:-.5px}
.side-close{display:none;margin-left:auto}
.new-chat{width:100%;border:1px solid #45445f;background:#222231;color:var(--text);border-radius:12px;padding:10px 12px;display:flex;gap:9px;align-items:center;font-weight:650;text-align:left;font-size:13.5px}
.new-chat:hover{background:#2b2a40}
.plus{font-size:20px;color:var(--accent);line-height:14px}
.kbd-hint{margin-left:auto;color:#7e8291;font-size:10px;font-weight:500}
.chat-list{overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:2px;min-height:0;padding-right:2px;overscroll-behavior:contain}
.group-label{padding:10px 8px 4px;color:#7a8091;font-size:11px;font-weight:650;letter-spacing:.2px}
.chat-item{display:flex;align-items:center;gap:6px;padding:0 4px 0 10px;min-height:38px;border-radius:10px;border:1px solid transparent;color:#c6c9d3;font-size:13px;cursor:pointer;min-width:0;flex:none}
.chat-item:hover{background:#1e2029}
.chat-item.active{background:#252635;border-color:#35364b;color:#fff}
.chat-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pin-btn{width:28px;height:28px;border:0;background:transparent;color:#7e8393;border-radius:8px;display:grid;place-items:center;opacity:0;flex:none;padding:0}
.pin-btn svg{width:15px;height:15px}
.pin-btn:hover{background:#2c2e3b;color:#fff}
.chat-item:hover .pin-btn,.chat-item:focus-within .pin-btn,.pin-btn.on{opacity:1}
.pin-btn.on{color:var(--accent)}
.pin-btn.on svg{fill:currentColor}
@media(hover:none){.pin-btn{opacity:1}}
.empty-history{color:#858b9b;font-size:12px;padding:15px 10px;text-align:center}
.show-more{display:block;flex:none;width:100%;margin:4px 0 2px;padding:8px 10px;border:1px dashed #343746;border-radius:10px;background:transparent;color:#aeb2c2;font-size:12px;font-weight:650;cursor:pointer;transition:background .15s,color .15s}
.show-more:hover{background:#1e2029;color:#fff}
.show-more:disabled{opacity:.6;cursor:default}
.limit-note{flex:none;margin:4px 2px 8px;padding:9px 10px;border:1px solid #713c45;background:#2b1b20;border-radius:10px;color:#ffc0c5;font-size:12px;line-height:1.45}
.sidebar-bottom{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.usage{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:#191a22;display:grid;gap:7px}
.usage-row{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:8px;font-size:11px;color:var(--muted)}
.quota-number{font-weight:750;color:var(--text);font-variant-numeric:tabular-nums}
.quota-track{height:4px;background:#30313d;border-radius:5px;overflow:hidden}
.quota-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .2s}
.quota-reset{font-size:10px;color:#777d8d}
.account-line{display:flex;align-items:center;gap:8px;padding:0 4px;color:var(--muted);font-size:11.5px;min-width:0}
.account-dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 4px #70d6b119;flex:none}
#accountLabel{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.footer-actions{display:grid;grid-template-columns:auto 1fr;gap:8px}
.ghost-btn,.auth-btn{height:38px;border-radius:11px;font-size:13px;font-weight:650;border:1px solid var(--line);background:#1b1d25;color:#d2d5df;padding:0 13px}
.ghost-btn:hover{background:#242631}
.auth-btn{background:var(--accent);border-color:var(--accent);color:#17152b;font-weight:800}
.auth-btn:hover{background:#c2beff}
.auth-btn.is-logout{background:transparent;color:#ffb4ba;border-color:#6a3a43}
.auth-btn.is-logout:hover{background:#2b1b20}
.auth-btn:disabled{opacity:.5;cursor:default}

/* ---------- main ---------- */
.main{min-width:0;flex:1;display:flex;flex-direction:column;position:relative}
.topbar{height:62px;flex:0 0 62px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 25px;gap:14px;background:#101116dd;backdrop-filter:blur(16px);z-index:5}
.top-left,.top-actions{display:flex;align-items:center;gap:11px;min-width:0}
.icon-btn{width:37px;height:37px;display:grid;place-items:center;border:1px solid transparent;background:transparent;color:#b9bdca;border-radius:11px;font-size:18px;padding:0}
.icon-btn:hover{background:var(--panel2);border-color:var(--line);color:#fff}
.mobile-menu{display:none}
.conversation-name{font-size:13px;color:#e6e7ee;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:42vw}
.status-pill{display:flex;align-items:center;gap:6px;color:#b0b5c5;font-size:11px;border:1px solid var(--line);border-radius:99px;padding:6px 9px;white-space:nowrap}
.status-dot{width:6px;height:6px;background:var(--good);border-radius:50%}
.messages{flex:1;overflow-y:auto;padding:32px 22px 20px;overscroll-behavior:contain}
.messages-inner{max-width:820px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:27px}
.welcome{margin:auto;max-width:640px;width:100%;padding:30px 0 55px;text-align:center}
.welcome-logo{width:72px;height:72px;margin:0 auto 22px;display:block}
.welcome-logo .logo{width:100%;height:100%;border-radius:20px}
.welcome h1{font-size:clamp(28px,4vw,39px);letter-spacing:-1.6px;margin:0 0 12px;font-weight:750}
.welcome p{color:var(--muted);font-size:14px;line-height:1.7;margin:0 auto 27px;max-width:480px}
.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;text-align:left}
.suggestion{background:#171920;border:1px solid var(--line);border-radius:15px;padding:14px;color:#d9dbe5;font-size:12px;line-height:1.5;text-align:left;transition:.15s}
.suggestion:hover{border-color:#5e5b9b;background:#20202d;transform:translateY(-1px)}
.suggestion strong{display:block;color:#fff;font-size:13px;margin-bottom:4px}
.message{display:grid;grid-template-columns:34px minmax(0,1fr);gap:13px;align-items:start;animation:appear .18s ease}
.avatar{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:12px;flex-shrink:0;overflow:hidden}
.avatar .logo{width:100%;height:100%;border-radius:0}
.message.user .avatar{background:#30323d;color:#e7e8ef}
.message-main{min-width:0;padding-top:3px}
.message-head{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.message-author{font-size:12px;font-weight:750}
.message-time{font-size:10px;color:#767c8b}
.msg-image{display:block;max-width:min(320px,100%);max-height:320px;border-radius:13px;border:1px solid #2f3240;margin:0 0 9px;cursor:zoom-in;object-fit:cover;background:#14161d}
.message-content{font-size:14px;line-height:1.78;color:#e2e4ec;overflow-wrap:anywhere}
.message.user .message-content{white-space:pre-wrap;color:#f2f3f8;background:#1b1d25;border:1px solid #292c37;border-radius:4px 15px 15px 15px;padding:12px 15px;display:inline-block;max-width:100%}
.message-content p{margin:0 0 12px}
.message-content p:last-child{margin-bottom:0}
.message-content h1,.message-content h2,.message-content h3{line-height:1.35;letter-spacing:-.4px;margin:19px 0 8px;color:#fff}
.message-content h1{font-size:22px}.message-content h2{font-size:19px}.message-content h3{font-size:16px}
.message-content ul,.message-content ol{padding-left:24px;margin:8px 0}
.message-content li{padding-left:3px;margin:4px 0}
.message-content blockquote{margin:10px 0;padding:3px 0 3px 13px;border-left:3px solid #7771ed;color:#bfc2d1}
.message-content code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.9em;background:#272a35;border:1px solid #343744;border-radius:5px;padding:2px 5px}
.code-wrap{position:relative;margin:12px 0;border:1px solid #30333e;background:#14161d;border-radius:12px;overflow:hidden}
.code-head{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid #30333e;color:#999fb0;font-size:10px}
.code-head button{border:0;background:transparent;color:#b9bdcb;font-size:11px}
.message-content pre{padding:13px 15px;margin:0;overflow:auto;line-height:1.6}
.message-content pre code{padding:0;border:0;background:transparent;font-size:12px}
.table-wrap{overflow-x:auto;margin:12px 0;border:1px solid #373a47;border-radius:12px;background:#15171e}
.message-content table{border-collapse:collapse;width:100%;font-size:13px;line-height:1.55}
.message-content th,.message-content td{border:0;border-bottom:1px solid #2f3240;padding:9px 13px;text-align:left;min-width:90px;vertical-align:top}
.message-content th{background:#242631;color:#fff;font-weight:700;white-space:nowrap}
.message-content tbody tr:last-child td{border-bottom:0}
.message-content tbody tr:nth-child(even) td{background:#191b23}
.message-content hr{border:0;border-top:1px solid var(--line);margin:17px 0}
.math-display{display:block;margin:12px 0;overflow-x:auto;overflow-y:hidden;text-align:center}
.math-display .katex-display{margin:0}
.katex{font-size:1.06em}
.stream-cursor{display:inline-block;width:7px;height:17px;background:var(--accent);border-radius:2px;margin-left:4px;vertical-align:-3px;animation:blink .85s steps(2,start) infinite}
.message-actions{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:10px}
.action-btn{border:1px solid transparent;background:transparent;color:#8e94a5;border-radius:8px;padding:6px 8px;font-size:11px;display:flex;align-items:center;gap:6px}
.action-btn:hover{color:#e5e6ed;background:#20222b;border-color:#30333e}
.action-btn:disabled{opacity:.45;cursor:default}

/* ---------- composer ---------- */
.composer-area{padding:8px 22px max(16px,env(safe-area-inset-bottom));background:linear-gradient(0deg,var(--bg) 78%,transparent)}
.composer-wrap{max-width:820px;margin:0 auto}
.composer{border:1px solid #373a48;border-radius:19px;background:#1a1c24;padding:10px 11px 9px;box-shadow:0 10px 40px #0002;transition:border .15s}
.composer:focus-within,.composer.dragover{border-color:#5d5a91}
.composer textarea{width:100%;resize:none;max-height:190px;min-height:45px;border:0;outline:0;background:transparent;color:var(--text);padding:9px 9px 5px;line-height:1.55;font-size:14px}
.composer textarea::placeholder{color:#7d8292}
.image-preview{display:flex;align-items:center;gap:10px;padding:4px 6px 2px}
.image-preview[hidden]{display:none}
.image-thumb{position:relative;width:58px;height:58px;flex:none}
.image-thumb img{width:100%;height:100%;object-fit:cover;border-radius:11px;border:1px solid #3a3d4c}
.image-remove{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;border:1px solid #4a4e60;background:#2a2d3a;color:#fff;font-size:12px;line-height:1;display:grid;place-items:center;padding:0}
.image-remove:hover{background:#3a3e50}
.image-note{font-size:11px;color:var(--muted)}
.composer-bottom{display:flex;align-items:center;justify-content:space-between;padding:5px 3px 0;gap:8px}
.composer-left{display:flex;align-items:center;gap:6px;min-width:0}
.attach-btn{width:36px;height:36px;border-radius:11px;border:1px solid transparent;background:transparent;color:#aeb3c3;display:grid;place-items:center;padding:0;flex:none}
.attach-btn:hover{background:#23252f;border-color:#32353f;color:#fff}
.attach-btn:disabled{opacity:.4;cursor:not-allowed}
.attach-btn svg{width:19px;height:19px}
.composer-hint{font-size:10px;color:#747a8a;padding-left:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.send-tools{display:flex;align-items:center;gap:7px}
.send-btn{height:36px;min-width:38px;padding:0 13px;border:0;border-radius:12px;background:var(--accent);color:#17152b;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;gap:7px}
.send-btn:hover{background:#c2beff}
.send-btn:disabled{opacity:.4;cursor:not-allowed}
.stop-btn{height:36px;padding:0 12px;border-radius:12px;background:#392126;border:1px solid #75404a;color:#ffb4ba;font-size:12px;font-weight:700}
.disclaimer{text-align:center;color:#666c7b;font-size:10px;margin:10px auto 0;line-height:1.5}
.overlay{display:none;position:fixed;inset:0;background:#0009;z-index:15}
.toast{position:fixed;bottom:28px;left:50%;transform:translate(-50%,15px);background:#272a35;border:1px solid #45495a;color:#f3f4f8;border-radius:12px;padding:10px 15px;font-size:12px;z-index:90;opacity:0;pointer-events:none;transition:.2s;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.error-banner{max-width:820px;margin:0 auto 12px;padding:10px 13px;border:1px solid #713c45;background:#2b1b20;border-radius:11px;color:#ffc0c5;font-size:12px;line-height:1.5}
.loader-dots{display:inline-flex;gap:4px;align-items:center;height:20px}
.loader-dots i{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:dot 1s infinite ease-in-out}
.loader-dots i:nth-child(2){animation-delay:.15s}.loader-dots i:nth-child(3){animation-delay:.3s}
@keyframes blink{to{opacity:0}}
@keyframes appear{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@keyframes dot{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-4px);opacity:1}}

/* ---------- gate (login, privacy, email verification) ---------- */
.gate{position:fixed;inset:0;background:#06070bd9;backdrop-filter:blur(7px);z-index:60;display:grid;place-items:center;padding:16px;overflow-y:auto}
.gate[hidden]{display:none}
.gate-card{position:relative;width:min(430px,100%);max-height:94dvh;overflow-y:auto;background:#171920;border:1px solid #2f3240;border-radius:20px;padding:24px 22px 20px;box-shadow:0 30px 80px #0008}
.gate-card.wide{width:min(520px,100%)}
.gate-x{position:absolute;top:12px;right:12px}
.gate-logo{width:44px;height:44px;margin-bottom:12px}
.gate-logo .logo{width:100%;height:100%;border-radius:12px}
.gate-card h2{margin:0 0 6px;font-size:21px;letter-spacing:-.6px}
.gate-sub{margin:0 0 16px;color:var(--muted);font-size:13px;line-height:1.6}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#12131a;border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
.tab{border:0;background:transparent;color:#a9aebe;height:34px;border-radius:9px;font-weight:650;font-size:13px}
.tab.active{background:#2a2b3d;color:#fff}
.google-btn{width:100%;height:44px;border-radius:12px;border:1px solid #3a3d4c;background:#f3f4f8;color:#1b1c24;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:10px}
.google-btn:hover{background:#fff}
.google-btn svg{width:18px;height:18px}
.or{display:flex;align-items:center;gap:10px;color:#777d8d;font-size:11px;margin:14px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.field{display:block;margin-bottom:12px;font-size:12px;color:#b4b9c8;font-weight:600}
.field input[type=email],.field input[type=password],.field input[type=text]{display:block;width:100%;margin-top:6px;height:44px;border-radius:11px;border:1px solid #373a48;background:#12131a;color:var(--text);padding:0 13px;font-size:16px}
.field input:focus{border-color:#5d5a91;outline:0}
.gate-error{min-height:18px;color:#ffb4ba;font-size:12px;line-height:1.5;margin:2px 0 8px}
.gate-ok{color:#9ae6c8}
.primary-btn,.secondary-btn{width:100%;height:44px;border-radius:12px;font-weight:800;font-size:14px;border:1px solid var(--accent);background:var(--accent);color:#17152b}
.primary-btn:hover{background:#c2beff}
.secondary-btn{background:transparent;color:#d7d9e6;border-color:#3a3d4c;font-weight:650}
.secondary-btn:hover{background:#20222b}
.primary-btn:disabled,.secondary-btn:disabled{opacity:.45;cursor:not-allowed}
.link-btn{display:block;margin:12px auto 0;border:0;background:transparent;color:#b8b4ff;font-size:13px;font-weight:600;padding:6px}
.link-btn:hover{text-decoration:underline}
.link-btn.muted{color:#9da3b2}
.policy-box{max-height:34dvh;overflow-y:auto;border:1px solid var(--line);background:#12131a;border-radius:12px;padding:12px 14px;font-size:12.5px;line-height:1.65;color:#c4c8d4;margin-bottom:14px}
.policy-box h3{font-size:13px;margin:12px 0 3px;color:#fff}
.policy-box h3:first-child{margin-top:0}
.policy-box p{margin:0}
.check-row{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:#d8dae5;margin-bottom:12px;cursor:pointer;line-height:1.5}
.check-row input{width:19px;height:19px;margin:1px 0 0;accent-color:#a9a5ff;flex:none}
.btn-stack{display:grid;gap:9px;margin-top:6px}
.hint-box{border:1px solid #3a3d52;background:#1b1d2a;border-radius:12px;padding:10px 12px;font-size:12.5px;color:#c4c8d8;line-height:1.55;margin:0 0 14px}
.lightbox{position:fixed;inset:0;z-index:80;background:#000d;display:grid;place-items:center;padding:20px;cursor:zoom-out}
.lightbox[hidden]{display:none}
.lightbox img{max-width:100%;max-height:100%;border-radius:12px}

/* ---------- responsive ---------- */
@media(min-width:1200px){.messages{padding-top:40px}}
@media(max-width:760px){
  .sidebar{position:fixed;inset:0 auto 0 0;width:min(310px,88vw);transform:translateX(-102%);box-shadow:18px 0 50px #0005;padding-bottom:max(10px,env(safe-area-inset-bottom))}
  .sidebar.open{transform:translateX(0)}
  .overlay.show{display:block}
  .mobile-menu,.side-close{display:grid}
  .kbd-hint{display:none}
  .topbar{height:56px;flex-basis:56px;padding:0 12px}
  .top-actions{gap:3px}
  .status-pill{font-size:10px;padding:5px 7px}
  .conversation-name{max-width:35vw}
  .messages{padding:23px 14px 18px}
  .messages-inner{gap:23px}
  .message{grid-template-columns:29px minmax(0,1fr);gap:10px}
  .avatar{width:28px;height:28px;border-radius:9px}
  .message-content{font-size:13px;line-height:1.72}
  .composer-area{padding:7px 12px max(12px,env(safe-area-inset-bottom))}
  .composer{border-radius:16px}
  .composer textarea{font-size:16px}
  .composer-hint{font-size:9px}
  .welcome{padding:25px 0 40px}
  .welcome-logo{width:60px;height:60px}
  .suggestions{grid-template-columns:1fr}
  .suggestion{padding:12px}
  .disclaimer{font-size:9px}

  async function emailLogin(email, pass) { await firebase.auth().signInWithEmailAndPassword(email, pass); }
  async function googleAuth() {
    const auth = firebase.auth(); const cur = auth.currentUser;
    const provider = new firebase.auth.GoogleAuthProvider(); provider.setCustomParameters({ prompt: 'select_account' });
    if (cur && cur.isAnonymous) {
      try {
        await cur.linkWithPopup(provider);
        await auth.currentUser.getIdToken(true);
        handleUser(auth.currentUser);
      } catch (e) {
        if (e.code === 'auth/credential-already-in-use' && e.credential) await auth.signInWithCredential(e.credential); // existing Google account: just log in
        else throw e;
      }
    } else await auth.signInWithPopup(provider);
  }
  async function doLogout() {
    if (!authUser || authUser.isAnonymous) return; // anonymous sessions cannot log out
    if (isGenerating) await stopGeneration(false);
    try { await firebase.auth().signOut(); closeSidebar(); } catch (e) { showToast('Could not log out. Please try again.'); }
  }

  const POLICY_HTML = `
    <h3>1. What we collect</h3><p>Your account details (email address and sign-in method), the conversations you have with Vaelis, images you attach, and usage counters used to apply daily limits.</p>
    <h3>2. How we use it</h3><p>To run the chat, keep your history available to you, enforce fair-use limits, prevent abuse and keep the service reliable. We do not sell your personal data.</p>
    <h3>3. Service providers</h3><p>Your messages and attached images are sent to Google’s Gemini API to generate replies. Firebase (Google) handles sign-in and stores your data, Cloudinary stores images you upload, and Cloudflare runs the Vaelis backend.</p>
    <h3>4. Images</h3><p>Uploaded images are stored so they stay visible in your conversation. Please don’t upload anything you are not comfortable storing with these providers.</p>
    <h3>5. Your choices</h3><p>You can log out at any time. To ask for your data to be deleted, contact the Vaelis owner.</p>
    <h3>6. Security</h3><p>Data is sent over encrypted connections. No system is perfectly secure, so avoid sharing passwords, financial details or other highly sensitive information in chats.</p>
    <h3>7. AI responses</h3><p>Vaelis can make mistakes. Check important information before relying on it.</p>
    <h3>8. Changes</h3><p>We may update this policy. Continuing to use Vaelis after an update means you accept the new version.</p>`;

  function privacyGate(run) {
    return new Promise((resolve) => {
      const card = openGate(`
        <div class="gate-logo">${logoHtml('logo')}</div>
        <h2>Privacy policy</h2>
        <p class="gate-sub">Please review and accept before you continue.</p>
        <div class="policy-box" tabindex="0">${POLICY_HTML}</div>
        <label class="check-row"><input type="checkbox" id="agreeBox"><span>I agree to all the terms</span></label>
        <div class="gate-error" id="gateError" role="alert"></div>
        <button class="primary-btn" type="button" id="continueBtn" disabled>Continue</button>
        <button class="link-btn muted" type="button" id="policyOut">Sign out</button>`, 'wide');
      const box = card.querySelector('#agreeBox'), btn = card.querySelector('#continueBtn'), err = card.querySelector('#gateError');
      box.addEventListener('change', () => { btn.disabled = !box.checked; });
      btn.addEventListener('click', async () => {
        btn.disabled = true; err.textContent = '';
        try { await api('/api/profile/privacy', { method: 'POST', body: { accepted: true } }); resolve(true); }
        catch (e) { err.textContent = e.message || 'Could not save your choice. Please try again.'; btn.disabled = !box.checked; }
      });
      card.querySelector('#policyOut').addEventListener('click', async () => { resolve(false); await doLogout(); });
    });
  }
  function verifyGate(user, run) {
    return new Promise((resolve) => {
      const card = openGate(`
        <div class="gate-logo">${logoHtml('logo')}</div>
        <h2>Verify your email</h2>
        <p class="gate-sub">We sent a verification link to <strong>${escapeHtml(user.email || 'your email')}</strong>. Open it, then come back and tap “I have verified”.</p>
        <p class="hint-box">Can’t find the email? Check your <strong>spam or junk</strong> folder too.</p>
        <div class="gate-error" id="gateError" role="alert"></div>
        <div class="btn-stack">
          <button class="primary-btn" type="button" id="verifiedBtn">I have verified</button>
          <button class="secondary-btn" type="button" id="resendBtn">Resend verification</button>
          <button class="secondary-btn" type="button" id="verifyOut">Signout</button>
        </div>`);
      const err = card.querySelector('#gateError'), verifiedBtn = card.querySelector('#verifiedBtn'), resendBtn = card.querySelector('#resendBtn');
      let tick = null;
      const cooldown = () => {
        clearInterval(tick);
        const update = () => {
          const left = Math.ceil((RESEND_COOLDOWN_MS - (Date.now() - lastVerificationSentAt)) / 1000);
          if (left > 0) { resendBtn.disabled = true; resendBtn.textContent = `Resend verification (${left}s)`; }
          else { resendBtn.disabled = false; resendBtn.textContent = 'Resend verification'; clearInterval(tick); }
        };
        update(); tick = setInterval(() => { if (!resendBtn.isConnected) { clearInterval(tick); return; } update(); }, 500);
      };
      cooldown();
      resendBtn.addEventListener('click', async () => {
        err.textContent = ''; err.classList.remove('gate-ok');
        try { await sendVerification(user, false); err.textContent = 'Verification email sent. Check your inbox and spam/junk folder.'; err.classList.add('gate-ok'); }
        catch (e) { err.textContent = authErrorMessage(e); }
        cooldown();
      });
      verifiedBtn.addEventListener('click', async () => {
        err.textContent = ''; err.classList.remove('gate-ok'); verifiedBtn.disabled = true;
        try {
          await user.reload();
          if (!user.emailVerified) { err.textContent = 'Your email isn’t verified yet. Open the link in the email, then try again.'; return; }
          await user.getIdToken(true);
          await api('/api/profile/email-verified', { method: 'POST', body: {} });
          resolve(true);
        } catch (e) { err.textContent = e.message || 'Could not confirm verification. Please try again.'; }
        finally { verifiedBtn.disabled = false; }
      });
      card.querySelector('#verifyOut').addEventListener('click', async () => { clearInterval(tick); resolve(false); await doLogout(); });
    });
  }
  async function runGates(user, run) {
    const profile = await (await api('/api/profile')).json();
    if (run !== runId) return false;
    if (!profile.privacyAccepted) { const ok = await privacyGate(run); if (!ok || run !== runId) return false; }
    if (isPasswordUser(user) && !profile.emailVerified) {
      try { await user.reload(); } catch {}
      if (user.emailVerified) { await user.getIdToken(true); await api('/api/profile/email-verified', { method: 'POST', body: {} }); }
      else { const ok = await verifyGate(user, run); if (!ok || run !== runId) return false; }
    }
    return run === runId;
  }

  /* ------------------------------------------------------------ session lifecycle */
  async function startApp(run) {
    try {
      setStatus('Connected', true);
      await Promise.all([loadConversations(), loadQuota()]);
      if (run !== runId) return;
      const latest = [...conversations].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))[0];
      if (latest) await loadConversation(latest.id); else renderConversation();
    } catch (e) {
      setStatus('Backend unavailable', false);
      showError('Connected to Firebase, but the Vaelis backend could not be reached. Check Cloudflare Worker environment variables, allowed frontend origin, Firebase token verification, and deployment. ' + e.message);
    }
  }
  async function handleUser(user) {
    const run = ++runId;
    authUser = user; updateAccountUI();
    currentConversationId = null; currentMessages = []; conversations = []; convTotal = 0; moreFlags = { pinned: false, recent: false }; setGenMode(false); clearPendingImage(); showError('');
    renderConversation();
    if (!user) return;
    if (user.isAnonymous) { appBlocked = false; refreshSend(); closeGate(); await startApp(run); return; }
    appBlocked = true; refreshSend();
    try {
      const ok = await runGates(user, run);
      if (!ok || run !== runId) return;
      appBlocked = false; refreshSend(); closeGate();
      await startApp(run);
    } catch (e) {
      if (run !== runId) return;
      setStatus('Backend unavailable', false);
      const card = openGate(`<h2>Couldn’t finish signing in</h2><p class="gate-sub">${escapeHtml(e.message || 'Please try again.')}</p><div class="btn-stack"><button class="primary-btn" type="button" id="retryBtn">Try again</button><button class="secondary-btn" type="button" id="retryOut">Sign out</button></div>`);
      card.querySelector('#retryBtn').addEventListener('click', () => handleUser(firebase.auth().currentUser));
      card.querySelector('#retryOut').addEventListener('click', doLogout);
    }
  }

  /* ------------------------------------------------------------ events */
  ui.sendBtn.addEventListener('click', () => sendMessage());
  ui.stopBtn.addEventListener('click', () => stopGeneration(true));
  ui.newChatBtn.addEventListener('click', newConversation);
  ui.menuBtn.addEventListener('click', openSidebar); ui.sideCloseBtn.addEventListener('click', closeSidebar); ui.overlay.addEventListener('click', closeSidebar);
  ui.exportBtn.addEventListener('click', exportConversation); ui.sidebarExportBtn.addEventListener('click', () => { exportConversation(); closeSidebar(); });
  ui.authBtn.addEventListener('click', () => { if (!authUser) return; if (authUser.isAnonymous) { closeSidebar(); showAuthModal('login'); } else doLogout(); });
  ui.attachBtn.addEventListener('click', (e) => { e.stopPropagation(); const open = ui.plusMenu.hidden; ui.plusMenu.hidden = !open; ui.attachBtn.setAttribute('aria-expanded', open ? 'true' : 'false'); });
  ui.plusMenu.addEventListener('click', (e) => {
    const b = e.target.closest('[data-pick]'); if (!b) return; e.stopPropagation(); closePlusMenu();
    if (quota.images.remaining <= 0) { showToast(attachmentLimitMessage()); return; }
    pickKind = b.dataset.pick; ui.fileInput.accept = ACCEPT[pickKind]; ui.fileInput.value = ''; ui.fileInput.click();
  });
  document.addEventListener('click', (e) => { if (!ui.plusMenu.hidden && !e.target.closest('.plus-wrap')) closePlusMenu(); });
  ui.genBtn.addEventListener('click', () => {
    if (!authUser) return;
    if (quota.tier === 'anonymous') { showToast('Image generation is only available for logged-in accounts. Please log in to use it.'); return; }
    setGenMode(!genMode); if (genMode) ui.input.focus();
  });
  ui.fileInput.addEventListener('change', () => attachFile(ui.fileInput.files && ui.fileInput.files[0], pickKind));
  ui.input.addEventListener('input', resizeInput);
  ui.input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendMessage(); } });
  ui.input.addEventListener('paste', e => { const f = [...(e.clipboardData?.files || [])][0]; if (f && guessKind(f)) { e.preventDefault(); attachFile(f); } });
  ui.composer.addEventListener('dragover', e => { if ([...(e.dataTransfer?.types || [])].includes('Files')) { e.preventDefault(); ui.composer.classList.add('dragover'); } });
  ui.composer.addEventListener('dragleave', () => ui.composer.classList.remove('dragover'));
  ui.composer.addEventListener('drop', e => { e.preventDefault(); ui.composer.classList.remove('dragover'); const f = [...(e.dataTransfer?.files || [])][0]; if (f) attachFile(f); });
  ui.lightbox.addEventListener('click', () => { ui.lightbox.hidden = true; ui.lightboxImg.removeAttribute('src'); });
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); newConversation(); }
    if (e.key === 'Escape') { closeSidebar(); closePlusMenu(); if (!ui.lightbox.hidden) ui.lightbox.click(); if (!ui.gate.hidden && ui.gate.querySelector('[data-close]')) closeGate(); }
  });
  ui.messagesInner.addEventListener('click', e => {
    const img = e.target.closest('img.msg-image'); if (img) { ui.lightboxImg.src = img.src; ui.lightbox.hidden = false; return; }
    const suggestion = e.target.closest('[data-prompt]'); if (suggestion) { ui.input.value = suggestion.dataset.prompt; resizeInput(); ui.input.focus(); return; }
    const copyCode = e.target.closest('[data-copy-code]');
    if (copyCode) { const code = copyCode.closest('.code-wrap')?.querySelector('pre code')?.textContent || ''; if (navigator.clipboard?.writeText) navigator.clipboard.writeText(code).then(() => showToast('Code copied.')).catch(() => fallbackCopy(code)); else fallbackCopy(code); return; }
    const action = e.target.closest('[data-action]'); if (!action) return;
    const row = action.closest('.message'); const text = row?.querySelector('.message-content')?.innerText?.replace(/\s*$/, '') || '';
    if (action.dataset.action === 'read') readAloud(text, action);
    if (action.dataset.action === 'share') shareResponse(text);
    if (action.dataset.action === 'regenerate') regenerateFrom(row);
    if (action.dataset.action === 'edit') startEdit(row);
    if (action.dataset.action === 'edit-cancel') cancelEdit(row);
    if (action.dataset.action === 'edit-done') finishEdit(row);
  });

  /* ------------------------------------------------------------ boot */
  function boot() {
    renderConversation(); applyQuota({});
    try { fetch(API_BASE + '/health', { cache: 'no-store' }).catch(() => {}); } catch {}
    try {
      firebase.initializeApp(firebaseConfig);
      const auth = firebase.auth(); auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(() => {});
      auth.onAuthStateChanged(async user => {
        if (!user) {
          authUser = null; updateAccountUI(); setStatus('Connecting', true);
          try { await auth.signInAnonymously(); } catch (e) {
            setStatus('Sign-in failed', false);
            const code = String(e && e.code || 'auth/unknown'); const detail = String(e && e.message || 'No additional details were returned.');
            let next = '';
            if (code === 'auth/operation-not-allowed') next = 'Anonymous sign-in is disabled for this Firebase project. In Authentication → Sign-in method, enable Anonymous and save.';
            else if (code === 'auth/unauthorized-domain') next = 'The current website domain is not authorized. In Authentication → Settings → Authorized domains, add the exact hostname shown in your browser address bar, without https://, paths, or trailing slashes.';
            else if (code === 'auth/api-key-not-valid' || code === 'auth/invalid-api-key') next = 'The Firebase Web API key is invalid or restricted. Copy the Web API key from Project settings → General → Your apps, and check its API/referrer restrictions in Google Cloud Console.';
            else if (code === 'auth/network-request-failed') next = 'The browser could not reach Firebase. Check your internet connection, VPN/ad blocker, and whether https://identitytoolkit.googleapis.com is blocked.';
            else if (code === 'auth/too-many-requests') next = 'Firebase temporarily blocked repeated sign-in attempts. Wait a little before trying again.';
            else next = 'Open the browser developer console for more details, and verify the Firebase Web app configuration belongs to project vaelisagi.';
            showError('Anonymous sign-in failed. Firebase error: ' + code + '. ' + detail + ' Next step: ' + next);
          }
          return;
        }
        handleUser(user);
      });
    } catch (e) { setStatus('Setup error', false); showError('Firebase could not initialize. Check the Firebase configuration and make sure Anonymous sign-in is enabled.'); }
  }
  boot();
})();
</script>
</body>
