<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d12">
  <title>Vaelis — Connection Diagnostics</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #0b0d12;
      color: #f5f5fa;
      font-family: Inter, system-ui, sans-serif;
    }
    main {
      width: 100%;
      max-width: 480px;
      padding: 26px;
      border: 1px solid #292e3b;
      border-radius: 22px;
      background: #141720;
    }
    .logo {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -1.5px;
    }
    .logo span { color: #a394ff; }
    .sub { color: #a2a8b8; line-height: 1.6; }
    .status {
      margin-top: 14px;
      padding: 15px;
      border-radius: 12px;
      background: #1c2130;
      overflow-wrap: anywhere;
    }
    .label {
      margin-bottom: 7px;
      color: #a2a8b8;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .value { font-size: 14px; line-height: 1.6; }
    button {
      width: 100%;
      margin-top: 12px;
      padding: 13px;
      border: 0;
      border-radius: 11px;
      background: #a394ff;
      color: #11111a;
      font-size: 14px;
      font-weight: 750;
      cursor: pointer;
    }
    button.secondary {
      margin-top: 8px;
      background: #292e3b;
      color: white;
    }
    #log {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #0b0d12;
      color: #c6cad6;
      font: 12px/1.65 ui-monospace, monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main>
    <div class="logo">Vaelis<span>.</span></div>
    <p class="sub">Checking Firebase Authentication and the Vaelis serverless backend independently.</p>

    <section class="status">
      <div class="label">FIREBASE AUTHENTICATION</div>
      <div class="value" id="authStatus">Initializing…</div>
    </section>

    <section class="status">
      <div class="label">CLOUDFLARE WORKER</div>
      <div class="value" id="workerStatus">Checking backend…</div>
    </section>

    <section class="status">
      <div class="label">ACCOUNT</div>
      <div class="value" id="accountStatus">Waiting for authentication…</div>
    </section>

    <button id="retry">Retry connection</button>
    <button id="toggleLog" class="secondary">Hide diagnostics</button>
    <div id="log">Starting…</div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

  <script>
    const API = "https://vaelis-backend.prathameshsingh5.workers.dev";

    const firebaseConfig = {
      apiKey: "AIzaSyDsAIXYDJvBwv8qdElLAc9EcFVFYa6AC4",
      authDomain: "vaelisagi.firebaseapp.com",
      projectId: "vaelisagi",
      storageBucket: "vaelisagi.firebasestorage.app",
      messagingSenderId: "235980356458",
      appId: "1:235980356458:web:629cb7e373940113ec8313"
    };

    const $ = id => document.getElementById(id);
    let logs = [];
    let attempt = 0;

    function log(message) {
      logs.push(new Date().toLocaleTimeString() + " — " + message);
      if (logs.length > 50) logs.shift();
      $("log").textContent = logs.join("\n");
    }

    function status(id, message) {
      $(id).textContent = message;
    }

    async function checkWorker() {
      status("workerStatus", "Checking /health…");

      try {
        const response = await fetch(API + "/health");
        const data = await response.json();

        if (!response.ok || !data.ok) {
          throw new Error("HTTP " + response.status);
        }

        status("workerStatus", "Online — " + (data.service || "Vaelis backend"));
        log("Worker health endpoint responded successfully.");
      } catch (error) {
        status("workerStatus", "Unable to confirm backend availability.");
        log("Worker check: " + error.message);
        log("Check the deployed Worker URL and browser network access.");
      }
    }

    async function withTimeout(promise, milliseconds, message) {
      let timer;

      try {
        return await Promise.race([
          promise,
          new Promise((_, reject) => {
            timer = setTimeout(() => reject(new Error(message)), milliseconds);
          })
        ]);
      } finally {
        clearTimeout(timer);
      }
    }

    async function checkFirebase() {
      status("authStatus", "Initializing Firebase…");
      status("accountStatus", "Checking account…");

      if (!window.firebase) {
        status("authStatus", "Firebase SDK failed to load.");
        status("accountStatus", "Authentication unavailable");
        log("Firebase SDK did not load. Check your network or browser blockers.");
        return;
      }

      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }

        const auth = firebase.auth();
        log("Firebase SDK initialized.");

        const existingUser = await withTimeout(
          new Promise((resolve, reject) => {
            const unsubscribe = auth.onAuthStateChanged(
              user => {
                unsubscribe();
                resolve(user);
              },
              error => {
                unsubscribe();
                reject(error);
              }
            );
          }),
          12000,
          "Firebase authentication initialization timed out."
        );

        let user = existingUser;

        if (!user) {
          status("authStatus", "Signing in anonymously…");
          log("No existing session. Attempting anonymous sign-in.");

          const result = await withTimeout(
            auth.signInAnonymously(),
            12000,
            "Anonymous sign-in timed out."
          );

          user = result.user;
        }

        status("authStatus", "Connected");
        status("accountStatus", "Authentication successful");
        log("Firebase authentication succeeded.");
        log("Authenticated UID: " + user.uid);
        log("The protected API can now be tested using a Firebase ID token.");

        const token = await user.getIdToken();
        const quotaResponse = await fetch(API + "/api/quota", {
          headers: { Authorization: "Bearer " + token }
        });

        if (quotaResponse.ok) {
          log("Protected Worker API authentication succeeded.");
          log("Quota endpoint responded successfully.");
        } else {
          log("Protected Worker API returned HTTP " + quotaResponse.status + ".");
          log("Check Worker configuration, token verification, and CORS settings.");
        }
      } catch (error) {
        status("authStatus", "Authentication failed");
        status("accountStatus", "Not authenticated");

        const code = error.code || "unknown";
        log("Error code: " + code);
        log("Details: " + (error.message || String(error)));

        if (code.includes("invalid-api-key")) {
          log("Check that this exact API key belongs to the vaelisagi Firebase project.");
        } else if (code.includes("operation-not-allowed")) {
          log("Enable Anonymous sign-in in Firebase Console > Authentication > Sign-in method.");
        } else if (code.includes("unauthorized-domain")) {
          log("Add this website's hostname in Firebase Console > Authentication > Settings > Authorized domains.");
        } else if (code.includes("network-request-failed")) {
          log("Check internet access, browser extensions, and connectivity to Firebase.");
        } else if (code.includes("too-many-requests")) {
          log("Firebase temporarily limited requests. Wait before retrying.");
        }
      }
    }

    async function runDiagnostics() {
      attempt++;
      logs = [];
      $("log").textContent = "";
      status("authStatus", "Starting…");
      status("workerStatus", "Checking…");
      status("accountStatus", "Waiting…");

      log("Diagnostic attempt " + attempt + ".");
      await Promise.allSettled([checkWorker(), checkFirebase()]);
    }

    $("retry").addEventListener("click", runDiagnostics);

    $("toggleLog").addEventListener("click", () => {
      $("log").hidden = !$("log").hidden;
      $("toggleLog").textContent =
        $("log").hidden ? "Show diagnostics" : "Hide diagnostics";
    });

    runDiagnostics();
  </script>
</body>
</html>
